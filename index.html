/* =====================================================
   CAMERA LOOK
   LEFT / RIGHT INVERTED
===================================================== */

let yaw=0;
let pitch=0;

let mouseDown=false;

window.addEventListener(
    "mousedown",
    ()=>{
        mouseDown=true;
    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown)return;

        yaw-=e.movementX*.002;

        pitch-=e.movementY*.002;

        pitch=Math.max(
            -1.35,
            Math.min(
                1.35,
                pitch
            )
        );
    }
);

   MOBILE LOOK
===================================================== */

        "lookArea"

let looking=false;

let lastX=0;
let lastY=0;

lookArea.addEventListener(
    "touchstart",
    e=>{

        const t=e.touches[0];

        looking=true;

        lastX=t.clientX;
        lastY=t.clientY;

    },
    {passive:false}
);

lookArea.addEventListener(
    "touchmove",
    e=>{

        if(!looking)return;

        const t=e.touches[0];

        const dx=
            t.clientX-lastX;

        const dy=
            t.clientY-lastY;

        yaw-=dx*.005;

        pitch-=dy*.005;

        pitch=Math.max(
            -1.35,
            Math.min(
                1.35,
                pitch
            )
        );

        lastX=t.clientX;
        lastY=t.clientY;

        e.preventDefault();

    },
    {passive:false}
);

lookArea.addEventListener(
    "touchend",
    ()=>{
        looking=false;
    }
);


/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
    document.getElementById(
        "joystick"

const stick=
    document.getElementById(
        "stick"
    );

let joyX=0;
let joyY=0;
let joystickActive=false;


function updateJoystick(x,y){

    const rect=
        joystick.getBoundingClientRect();

    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=45;

    const distance=
        Math.hypot(dx,dy);

    if(distance>max){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
    "touchstart",
    e=>{

        joystickActive=true;

        const t=e.touches[0];

        updateJoystick(
            t.clientX,
            t.clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        if(!joystickActive)return;

        const t=e.touches[0];

        updateJoystick(
            t.clientX,
            t.clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    ()=>{

        joystickActive=false;

        joyX=0;
        joyY=0;

        stick.style.transform=
            "translate(0,0)";
    }
);

        }
    });

    return distance<4
        ? closest
        : null;
}


function showMessage(text){

    message.textContent=text;

    message.style.display="block";

    setTimeout(
        ()=>{
            message.style.display="none";
        },
        1300
    );
}


function interact(){

    const d=nearestDoor();

    if(!d)return;

    if(!d.userData.open){

        d.userData.open=true;

        d.rotation.y=Math.PI/2;

        showMessage(
            "DOOR OPENED"
        );

    }else{

        d.userData.open=false;

        d.rotation.y=0;

        showMessage(
            "DOOR CLOSED"
        );
    }
}


interactButton.addEventListener(
    "click",
    interact
);


/* =====================================================
   MOVEMENT
===================================================== */

const clock=new THREE.Clock();


function movement(){

    const delta=clock.getDelta();

    let forward=0;
    let side=0;


    /* keyboard */

    if(
        keys["w"] ||
        keys["arrowup"]
    )
        forward+=1;

    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        forward-=1;

    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        side-=1;

    if(
        keys["d"] ||
        keys["arrowright"]
    )
        side+=1;


    /* joystick */

    forward-=joyY;

    /*
       LEFT / RIGHT INVERTED
    */

    side-=joyX;


    const len=
        Math.hypot(
            forward,
            side
        );

    if(len>1){

        forward/=len;
        side/=len;
    }


    /* direction */

    const direction=
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.y=0;

    direction.normalize();


    const right=
        new THREE.Vector3(
            direction.z,
            0,
            -direction.x
        );


    /* movement */

    camera.position.addScaledVector(
        direction,
        forward*
        player.speed*
        delta
    );

    camera.position.addScaledVector(
        right,
        side*
        player.speed*
        delta
    );


    /* basic world boundaries */

    camera.position.x=
        Math.max(
            -7.2,
            Math.min(
                21,
                camera.position.x
            )
        );

    camera.position.z=
        Math.max(
            -29,
            Math.min(
                14,
                camera.position.z
            )
        );

    camera.position.y=
        player.height;


    camera.rotation.order=
        "YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    const d=nearestDoor();

    interactButton.style.display=
        d ? "block" : "none";

    if(d===door){

        document.getElementById(
            "objective"
        ).textContent=
            "OBJECTIVE: Classroom 204";

    }else if(d===facultyDoor){

        document.getElementById(
            "objective"
        ).textContent=
            "OBJECTIVE: Faculty Room";

    }else{

        document.getElementById(
            "objective"
        ).textContent=
            "OBJECTIVE: Explore the school";
    }
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    movement();

    updateUI();

    renderer.render(
        scene,
        camera
    );
}

animate();

});
</script>
